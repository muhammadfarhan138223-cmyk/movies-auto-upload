name: Deploy read-only mobile PWA
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate public configuration
        env:
          UPLOAD_SUPABASE_URL: ${{ vars.UPLOAD_SUPABASE_URL }}
          UPLOAD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.UPLOAD_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/make-mobile-config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
